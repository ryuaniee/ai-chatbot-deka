services:
  postgres:
    image: postgres:17-alpine
    container_name: chatbot-deka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatbot_deka
      POSTGRES_USER: chatbot_deka
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_deka -d chatbot_deka"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
