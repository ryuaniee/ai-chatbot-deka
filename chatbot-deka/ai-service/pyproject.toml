[project]
name = "chatbot-deka-ai-service"
version = "0.1.0"
description = "FastAPI and LangChain service skeleton for Chatbot Deka."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
